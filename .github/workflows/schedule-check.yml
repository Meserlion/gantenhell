name: Schedule Check & Auto-Update

on:
  schedule:
      - cron: '0 8 * * *'
        workflow_dispatch:

        jobs:
          check-and-update:
              runs-on: ubuntu-latest
                  permissions:
                        contents: write
                              issues: write

                                  steps:
                                        - name: Checkout repo
                                                uses: actions/checkout@v4

                                                      - name: Set up Python
                                                              uses: actions/setup-python@v5
                                                                      with:
                                                                                python-version: '3.12'

                                                                                      - name: Install dependencies
                                                                                              run: pip install requests beautifulsoup4

                                                                                                    - name: Run schedule checker
                                                                                                            id: checker
                                                                                                                    run: python scripts/check_schedule.py
                                                                                                                    
                                                                                                                          - name: Commit and push if changed
                                                                                                                                  if: steps.checker.outputs.changed == 'true'
                                                                                                                                          run: |
                                                                                                                                                    git config user.name  "schedule-bot"
                                                                                                                                                              git config user.email "schedule-bot@users.noreply.github.com"
                                                                                                                                                                        git add index.html scripts/schedule-state.json
                                                                                                                                                                                  git commit -m "chore: auto-update schedule from Clashfinder [$(date -u +%Y-%m-%d)]"
                                                                                                                                                                                            git push
